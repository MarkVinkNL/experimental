<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experimentals</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        margin: 0;
        background: #080c12;
        color: #c9d1d9;
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(88, 166, 255, 0.12), transparent),
          radial-gradient(ellipse 60% 40% at 80% 90%, rgba(139, 92, 246, 0.07), transparent);
      }

      .page {
        max-width: 860px;
        margin: 0 auto;
        padding: 3rem 1.5rem 4rem;
      }

      header {
        margin-bottom: 3rem;
        border-bottom: 1px solid #1a2030;
        padding-bottom: 2rem;
      }

      h1 {
        font-size: 2.4rem;
        font-weight: 700;
        margin: 0 0 0.4rem;
        background: linear-gradient(135deg, #e6edf3 30%, #58a6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
      }

      p.subtitle {
        color: #8b949e;
        margin: 0;
        font-size: 1rem;
      }

      section {
        margin-bottom: 2.5rem;
      }

      h2 {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #58a6ff;
        margin: 0 0 1rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, #1e2a3a, transparent);
      }

      h3 {
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6b7280;
        margin: 1.25rem 0 0.5rem;
        padding-left: 0.1rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      li a {
        display: inline-block;
        padding: 0.4rem 0.85rem;
        border-radius: 8px;
        background: #0d1117;
        border: 1px solid #21262d;
        color: #b0bec5;
        text-decoration: none;
        font-size: 0.85rem;
        transition:
          border-color 0.2s,
          color 0.2s,
          background 0.2s,
          box-shadow 0.2s;
        position: relative;
      }

      li a:hover {
        border-color: #58a6ff;
        color: #e6edf3;
        background: #111820;
        box-shadow: 0 0 12px rgba(88, 166, 255, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Experimentals</h1>
        <p class="subtitle">A collection of experimental demos I made the last 15 years</p>
      </header>

      <!-- GENERATED_CONTENT -->
    </div>
  </body>
</html>
